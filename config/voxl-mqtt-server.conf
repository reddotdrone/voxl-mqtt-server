# VOXL MQTT broker configuration (native Mosquitto syntax).
# Restart voxl-mqtt-server after editing listener or security settings.
listener 1883 0.0.0.0
allow_anonymous true

# Keep flash writes off by default. Retained messages survive only while running.
persistence false
# persistence_location /var/lib/voxl-mqtt-server/

log_dest stdout
log_type error
log_type warning
log_type notice

# Listen on all IPv4 interfaces, including Wi-Fi and localhost.
# Anonymous access is enabled; use passwords/TLS on untrusted networks.
# Set allow_anonymous false when enabling the password file below.
# password_file /etc/modalai/voxl-mqtt-server.passwd
# acl_file /etc/modalai/voxl-mqtt-server.acl

# TLS: change listener port to 8883 and provide readable certificate/key files.
# cafile /etc/modalai/mqtt-certs/ca.crt
# certfile /etc/modalai/mqtt-certs/server.crt
# keyfile /etc/modalai/mqtt-certs/server.key
